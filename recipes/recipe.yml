# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: silverpeak
description: Production-ready Fedora Silverblue with pinned versioning, Flatpak Steam, zero telemetry, controller drivers, automated maintenance, and pre-configured Flatpak permissions.

# Base Image pinned explicitly to Fedora 44
base-image: ghcr.io/ublue-os/silverblue-main
image-version: "44"

modules:
  # Official BlueBuild module for system-wide Flatpaks (v2 syntax)
  - type: default-flatpaks
    configurations:
      - scope: system
        repo-url: https://dl.flathub.org/repo/flathub.flatpakrepo
        repo-name: flathub
        install:
          - com.valvesoftware.Steam
          - io.gitlab.librewolf-community
          - org.onlyoffice.desktopeditors
          - com.github.tchx84.Flatseal
          - org.videolan.VLC
          - ca.littlesvr.asunder
          - com.mattjakeman.ExtensionManager

  # Native GNOME Extensions module (using Extension IDs)
  - type: gnome-extensions
    install:
      - 3193  # Blur my Shell
      - 1460  # Vitals

  # Package management (install native RPMs & remove stock Firefox)
  - type: rpm-ostree
    remove:
      - firefox                        # Remove native Firefox (using LibreWolf Flatpak)
      - firefox-langpacks
    install:
      # Gaming & Performance Utilities
      - gamemode                       # Performance optimization daemon
      - mangohud                       # Performance overlay
      
      # GNOME Desktop Extensions available in Fedora base repos
      - gnome-shell-extension-appindicator
      - gnome-shell-extension-dash-to-dock

      # Container Development & Workflows
      - distrobox                      # Isolated CLI containers (Ubuntu/Debian/Arch)
      
      # CLI & Terminal Utilities
      - git
      - gh                             # GitHub CLI
      - btop                           # Modern process monitor
      - fastfetch                      # System information display
      - p7zip
      - unzip
      - rsync
      - cabextract                     # Needed for MS Core Fonts extraction
      
      # Font & Media Enhancements
      - fira-code-fonts                # Monospace terminal font
      - google-noto-color-emoji-fonts

  # Kernel Modules (Xbox Controller Driver for Bluetooth / Rumble)
  - type: akmods
    install:
      - xpadneo

  # System Scripts: Fonts, Privacy, MIME Associations, Terminal Auto-Fastfetch, Panel CSS, and Dconf Overrides
  - type: script
    snippets:
      # 1. Download and extract Microsoft Core Fonts via valid SourceForge mirror path
      - |
        mkdir -p /usr/share/fonts/ms-core-fonts
        cd /tmp
        for font in arial32.exe arialb32.exe courie32.exe comic32.exe georg32.exe impact32.exe times32.exe verdan32.exe webdin32.exe; do
          curl -sL "https://downloads.sourceforge.net/project/corefonts/the%20fonts/final/$font" -o "$font"
          cabextract -q "$font" -d /usr/share/fonts/ms-core-fonts || true
          rm -f "$font"
        done
        fc-cache -f /usr/share/fonts/ms-core-fonts

      # 2. Write rpm-ostree automatic background staging safely with explicit [Daemon] header
      - |
        mkdir -p /usr/etc
        cat <<'EOF' > /usr/etc/rpm-ostreed.conf
        [Daemon]
        AutomaticUpdatePolicy=stage
        EOF
      
      # 3. Disable CountMe user metric pings
      - "systemctl mask rpm-ostree-countme.timer"

      # 4. Write gaming memory & kernel optimizations to vendor sysctl directory
      - |
        cat <<'EOF' > /usr/lib/sysctl.d/99-gaming-performance.conf
        vm.max_map_count=2147483642
        vm.swappiness=10
        vm.dirty_background_ratio=5
        vm.dirty_ratio=10
        EOF

      # 5. Create automatic weekly Flatpak garbage collection service
      - |
        cat <<'EOF' > /usr/lib/systemd/system/flatpak-uninstall-unused.service
        [Unit]
        Description=Clean unused Flatpak runtimes
        [Service]
        Type=oneshot
        ExecStart=/usr/bin/flatpak uninstall --unused -y
        EOF

        cat <<'EOF' > /usr/lib/systemd/system/flatpak-uninstall-unused.timer
        [Unit]
        Description=Weekly unused Flatpak runtime cleanup
        [Timer]
        OnCalendar=weekly
        Persistent=true
        [Install]
        WantedBy=timers.target
        EOF

      # 6. Bake LibreWolf DRM (Widevine) and Location preferences system-wide
      - |
        mkdir -p /usr/etc/firefox/policies /usr/etc/librewolf/policies
        cat <<'EOF' > /usr/etc/librewolf/policies/policies.json
        {
          "policies": {
            "EncryptedMediaExtensions": {
              "Enabled": true
            },
            "Preferences": {
              "geo.enabled": true,
              "media.eme.enabled": true
            }
          }
        }
        EOF
        cp /usr/etc/librewolf/policies/policies.json /usr/etc/firefox/policies/policies.json

        mkdir -p /etc/skel/.var/app/io.gitlab.librewolf-community/.librewolf
        cat <<'EOF' > /etc/skel/.var/app/io.gitlab.librewolf-community/.librewolf/librewolf.overrides.cfg
        pref("geo.enabled", true);
        pref("media.eme.enabled", true);
        EOF

      # 7. Set LibreWolf Flatpak as System-Wide Default Web Browser & Handler
      - |
        mkdir -p /etc/mimeapps.list.d
        cat <<'EOF' > /etc/xdg/mimeapps.list
        [Default Applications]
        text/html=io.gitlab.librewolf-community.desktop
        x-scheme-handler/http=io.gitlab.librewolf-community.desktop
        x-scheme-handler/https=io.gitlab.librewolf-community.desktop
        x-scheme-handler/about=io.gitlab.librewolf-community.desktop
        x-scheme-handler/unknown=io.gitlab.librewolf-community.desktop
        EOF

      # 8. Pre-configure system-wide Flatpak overrides statically
      - |
        mkdir -p /etc/flatpak/overrides
        cat <<'EOF' > /etc/flatpak/overrides/io.gitlab.librewolf-community
        [Context]
        filesystems=host
        EOF

        cat <<'EOF' > /etc/flatpak/overrides/ca.littlesvr.asunder
        [Context]
        devices=all
        filesystems=/dev/sr0
        EOF

        cat <<'EOF' > /etc/flatpak/overrides/com.heroicgameslauncher.hgl
        [Context]
        filesystems=/mnt;/media
        EOF

      # 9. Auto-run fastfetch for interactive terminal sessions system-wide
      - |
        mkdir -p /etc/profile.d
        cat <<'EOF' > /etc/profile.d/fastfetch.sh
        if [ -n "$PS1" ] && command -v fastfetch >/dev/null 2>&1; then
            fastfetch
        fi
        EOF

      # 10. Inject GTK panel background color fallback rule
      - |
        mkdir -p /etc/skel/.config/gtk-3.0 /etc/skel/.config/gtk-4.0
        cat <<'EOF' >> /etc/skel/.config/gtk-3.0/gtk.css
        #panel, #panel .panel-button {
            background-color: rgba(0, 0, 168, 0.48) !important;
        }
        EOF
        cp /etc/skel/.config/gtk-3.0/gtk.css /etc/skel/.config/gtk-4.0/gtk.css

      # 11. Compile dconf keyfile settings (Desktop preferences, Extensions, Terminal, Dash to Dock, Top Panel, & Applications Blur)
      - |
        mkdir -p /etc/dconf/db/local.d
        cat <<'EOF' > /etc/dconf/db/local.d/00-custom
        [org/gnome/shell]
        enabled-extensions=['appindicatorsupport@rgcjonas.gmail.com', 'dash-to-dock@micxgx.gmail.com', 'blur-my-shell@aunetx', 'vitals@corecoding.com']
        favorite-apps=['io.gitlab.librewolf-community.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Ptyxis.desktop', 'com.valvesoftware.Steam.desktop', 'org.onlyoffice.desktopeditors.desktop', 'org.videolan.VLC.desktop', 'com.github.tchx84.Flatseal.desktop', 'com.mattjakeman.ExtensionManager.desktop']

        [org/gnome/Ptyxis]
        default-profile-uuid='fa0ab452f1f195552e060a5d6a7644f3'

        [org/gnome/Ptyxis/Profiles/fa0ab452f1f195552e060a5d6a7644f3]
        label='Borland Custom'
        palette='Borland'
        opacity=0.48

        [org/gnome/desktop/wm/preferences]
        button-layout='appmenu:minimize,maximize,close'
        auto-raise=true
        focus-mode='click'

        [org/gnome/mutter]
        center-new-windows=true
        edge-tiling=true
        experimental-features=['scale-monitor-framebuffer']

        [org/gnome/desktop/interface]
        color-scheme='prefer-dark'
        font-antialiasing='rgba'
        font-hinting='slight'
        show-battery-percentage=true
        clock-show-weekday=true
        clock-show-date=true
        clock-format='12h'
        action-middle-click-titlebar='lower'

        [org/gnome/desktop/peripherals/touchpad]
        tap-to-click=true
        natural-scroll=true
        two-finger-scrolling-enabled=true

        [org/gnome/desktop/peripherals/keyboard]
        delay=250
        repeat-interval=30

        [org/gnome/desktop/sound]
        allow-volume-above-100-percent=true
        event-sounds=false

        [org/gnome/nautilus/preferences]
        default-folder-viewer='list-view'
        show-hidden-files=true
        search-view-recursive='always'

        [org/gnome/nautilus/list-view]
        use-tree-view=true
        default-zoom-level='small'

        [org/gnome/shell/extensions/dash-to-dock]
        dock-position='BOTTOM'
        dash-max-icon-size=48
        transparency-mode='FIXED'
        custom-background-color=true
        background-color='rgb(0, 0, 168)'
        background-opacity=0.48
        dock-fixed=true
        autohide=false
        show-mounts=false
        show-running-apps=true

        [org/gnome/shell/extensions/blur-my-shell/panel]
        blur=true
        customize-color=true
        custom-background-color=true
        color='(0.0, 0.0, 0.66, 0.48)'
        sigma=12
        brightness=0.62
        override-background-style=true
        style-panel=2

        [org/gnome/shell/extensions/blur-my-shell/overview]
        blur=true

        [org/gnome/shell/extensions/blur-my-shell/dash-to-dock]
        blur=true
        brightness=0.62

        [org/gnome/shell/extensions/blur-my-shell/appblur]
        blur=true
        dynamic-blur=true
        sigma=27
        brightness=0.62
        enable-border-radius=false
        enable-border-radius-maximized=false
        opacity=180
        opaque-focused=false
        blur-on-overview=false
        enable-all=true
        whitelist=['']
        blacklist=['Plank', 'com.desktop.ding', 'Conky', 'org.gnome.Ptyxis']

        [org/gnome/desktop/privacy]
        report-technical-problems=false
        send-software-usage-stats=false
        location-accuracy-level='none'

        [org/gnome/system/location]
        enabled=false
        EOF
        dconf update

  # Automated Background Services
  - type: systemd
    system:
      enabled:
        - flatpak-uninstall-unused.timer        # Weekly Flatpak runtime garbage collection
