# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: silverpeak
description: Production-ready Fedora Silverblue with pinned versioning, Flatpak Steam, zero telemetry, controller drivers, automated maintenance, and pre-configured Flatpak permissions.

# Base Image pinned explicitly to Fedora 44
base-image: ghcr.io/ublue-os/silverblue-main
image-version: "44"

modules:
  # Package management (install native RPMs & remove stock Firefox)
  - type: rpm-ostree
    remove:
      - firefox                        # Remove native Firefox (using LibreWolf Flatpak)
      - firefox-langpacks
    install:
      # Gaming & Performance Utilities (32-bit conflicts avoided by using Steam Flatpak)
      - gamemode                       # Performance optimization daemon
      - mangohud                       # Performance overlay
      
      # GNOME Desktop Extensions available in Fedora base repos
      - gnome-shell-extension-appindicator
      - gnome-shell-extension-dash-to-dock

      # Container Development & Workflows
      - distrobox                      # Isolated CLI containers (Ubuntu/Debian/Arch)
      
      # CLI & Terminal Utilities
      - git
      - gh                             # GitHub CLI
      - btop                           # Modern process monitor
      - fastfetch                      # System information display
      - p7zip
      - unzip
      - rsync
      - cabextract                     # Needed for MS Core Fonts extraction
      
      # Font & Media Enhancements
      - fira-code-fonts                # Monospace terminal font
      - google-noto-color-emoji-fonts

  # Kernel Modules (Xbox Controller Driver for Bluetooth / Rumble)
  - type: akmods
    install:
      - xpadneo

  # System Scripts: Fonts, Privacy, Extensions, Dconf Overrides, and Flatpaks
  - type: script
    snippets:
      # 1. Download and extract Microsoft Core Fonts via valid SourceForge mirror path
      - |
        mkdir -p /usr/share/fonts/ms-core-fonts
        cd /tmp
        for font in arial32.exe arialb32.exe courie32.exe comic32.exe georg32.exe impact32.exe times32.exe verdan32.exe webdin32.exe; do
          curl -sL "https://downloads.sourceforge.net/project/corefonts/the%20fonts/final/$font" -o "$font"
          cabextract -q "$font" -d /usr/share/fonts/ms-core-fonts || true
          rm -f "$font"
        done
        fc-cache -f /usr/share/fonts/ms-core-fonts

      # 2. Download Blur my Shell and Vitals GNOME extensions directly into system storage
      - |
        mkdir -p /usr/share/gnome-shell/extensions/blur-my-shell@aunetx
        mkdir -p /usr/share/gnome-shell/extensions/vitals@corecoding.com
        
        # Download and extract Blur my Shell
        curl -sL https://github.com/aunetx/blur-my-shell/releases/latest/download/blur-my-shell@aunetx.zip -o /tmp/bms.zip
        unzip -q -o /tmp/bms.zip -d /usr/share/gnome-shell/extensions/blur-my-shell@aunetx || true
        rm -f /tmp/bms.zip

        # Download and extract Vitals
        curl -sL https://github.com/corecoding/Vitals/releases/latest/download/vitals@corecoding.com.zip -o /tmp/vitals.zip
        unzip -q -o /tmp/vitals.zip -d /usr/share/gnome-shell/extensions/vitals@corecoding.com || true
        rm -f /tmp/vitals.zip

      # 3. Configure rpm-ostree automatic background staging safely in /usr/etc
      - "mkdir -p /usr/etc && sed -i 's/#AutomaticUpdatePolicy=none/AutomaticUpdatePolicy=stage/' /usr/etc/rpm-ostreed.conf || echo 'AutomaticUpdatePolicy=stage' >> /usr/etc/rpm-ostreed.conf"
      
      # 4. Disable CountMe user metric pings
      - "systemctl mask rpm-ostree-countme.timer"

      # 5. Write gaming memory & kernel optimizations to vendor sysctl directory
      - |
        cat <<'EOF' > /usr/lib/sysctl.d/99-gaming-performance.conf
        vm.max_map_count=2147483642
        vm.swappiness=10
        vm.dirty_background_ratio=5
        vm.dirty_ratio=10
        EOF

      # 6. Create automatic weekly Flatpak garbage collection service
      - |
        cat <<'EOF' > /usr/lib/systemd/system/flatpak-uninstall-unused.service
        [Unit]
        Description=Clean unused Flatpak runtimes
        [Service]
        Type=oneshot
        ExecStart=/usr/bin/flatpak uninstall --unused -y
        EOF

        cat <<'EOF' > /usr/lib/systemd/system/flatpak-uninstall-unused.timer
        [Unit]
        Description=Weekly unused Flatpak runtime cleanup
        [Timer]
        OnCalendar=weekly
        Persistent=true
        [Install]
        WantedBy=timers.target
        EOF

      # 7. Bake LibreWolf DRM (Widevine) and Location preferences system-wide
      - |
        mkdir -p /usr/etc/firefox/policies /usr/etc/librewolf/policies
        cat <<'EOF' > /usr/etc/librewolf/policies/policies.json
        {
          "policies": {
            "EncryptedMediaExtensions": {
              "Enabled": true
            },
            "Preferences": {
              "geo.enabled": true,
              "media.eme.enabled": true
            }
          }
        }
        EOF
        cp /usr/etc/librewolf/policies/policies.json /usr/etc/firefox/policies/policies.json

        mkdir -p /etc/skel/.var/app/io.gitlab.librewolf-community/.librewolf
        cat <<'EOF' > /etc/skel/.var/app/io.gitlab.librewolf-community/.librewolf/librewolf.overrides.cfg
        pref("geo.enabled", true);
        pref("media.eme.enabled", true);
        EOF

      # 8. Pre-configure system-wide Flatpak overrides statically
      - |
        mkdir -p /etc/flatpak/overrides
        cat <<'EOF' > /etc/flatpak/overrides/io.gitlab.librewolf-community
        [Context]
        filesystems=host
        EOF

        cat <<'EOF' > /etc/flatpak/overrides/ca.littlesvr.asunder
        [Context]
        devices=all
        filesystems=/dev/sr0
        EOF

        cat <<'EOF' > /etc/flatpak/overrides/com.heroicgameslauncher.hgl
        [Context]
        filesystems=/mnt;/media
        EOF

      # 9. Compile dconf keyfile settings (Desktop preferences & Privacy enforcement)
      - |
        mkdir -p /etc/dconf/db/local.d
        cat <<'EOF' > /etc/dconf/db/local.d/00-custom
        [org/gnome/shell]
        enabled-extensions=['appindicatorsupport@rgcjonas.gmail.com', 'dash-to-dock@micxgx.gmail.com', 'blur-my-shell@aunetx', 'vitals@corecoding.com']

        [org/gnome/desktop/peripherals/touchpad]
        tap-to-click=true

        [org/gnome/desktop/privacy]
        report-technical-problems=false
        send-software-usage-stats=false
        location-accuracy-level='none'

        [org/gnome/system/location]
        enabled=false
        EOF
        dconf update

      # 10. Enable Flathub & pre-install Flatpak applications during image build
      - |
        flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install --system -y flathub \
          com.valvesoftware.Steam \
          io.gitlab.librewolf-community \
          org.onlyoffice.desktopeditors \
          com.github.tchx84.Flatseal \
          org.videolan.VLC \
          ca.littlesvr.asunder \
          com.mattjakeman.ExtensionManager

  # Automated Background Services
  - type: systemd
    system:
      enabled:
        - flatpak-uninstall-unused.timer        # Weekly Flatpak runtime garbage collection
